name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - run: go test ./...
      - run: go build ./cmd/repo ./cmd/repopeek
      - run: cd examples/flow && go test ./... && go build .
      - run: cd examples/flow && go run . run repo_inspect.nflow "{\"root\":\"$GITHUB_WORKSPACE\"}"
